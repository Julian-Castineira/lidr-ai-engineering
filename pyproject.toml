[project]
name = "lidr-ai-engineering"
version = "0.1.0"
description = "Aplicación evolutiva del Máster AI Engineering (LIDR)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live' -ra"
markers = [
    "live: llamadas reales a la API de Anthropic (con coste); se activan con `pytest -m live`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
